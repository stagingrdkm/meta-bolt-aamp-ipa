useRialtoSink=true
useWesterosSink=false
fog=false
gstSubtecEnabled=false
subtecSubtitle=false
warn=1
debug=1
trace=1
gst=1            # GStreamer pipeline debug logging
progress=1       # progress report events (every 4th)
curl=0           # verbose curl download logging
curlHeader=0     # curl header response on errors
curlLicense=0    # verbose DRM license fetch logging
stream=1         # HLS playlist dump during parsing
failover=1       # failover tag and manifest detail logging
jsinfo=0         # JS media player interface logs
id3=1            # ID3 metadata debug logging
logMetadata=1    # timed metadata logging
